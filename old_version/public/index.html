<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>drawing_util · AI 像素画工坊</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <span class="logo">▦ drawing_util</span>
    <span class="sub">DeepSeek 像素画 · 多轮对话</span>
    <span class="spacer"></span>

    <label class="ctl" title="仅 chat：最快最便宜；自动升级：空白/格式失败后逐级开启思考；深度思考：直接使用 high 档">思考模式
      <select id="mode">
        <option value="chat">仅 chat</option>
        <option value="auto" selected>自动升级</option>
        <option value="deep">深度思考</option>
      </select>
    </label>

    <label class="ctl" title="本会话最多可花费的金额（人民币元），达到后停止生成">费用上限 ¥
      <input id="costLimit" type="number" min="0" step="0.01" value="0.50" inputmode="decimal">
    </label>
    <span id="spend" class="spend" title="本会话累计实际费用">¥0.0000 / ¥0.50</span>

    <label class="ctl">放大倍数
      <select id="scale">
        <option value="8">8×</option>
        <option value="16" selected>16×</option>
        <option value="32">32×</option>
        <option value="64">64×</option>
      </select>
    </label>
    <a id="galleryLink" href="#" target="_blank" hidden>🖼 画廊</a>
  </header>

  <div class="layout">
    <!-- 左：会话 + 对话 -->
    <aside class="left">
      <div class="session-bar">
        <button id="newSessionBtn" title="新建会话">＋ 新会话</button>
        <select id="sessionSelect" title="切换会话"></select>
      </div>
      <div id="chat" class="chat"></div>
      <div id="status" class="status" hidden></div>
      <form id="composer" class="composer">
        <textarea id="input" rows="2" placeholder="描述你想要的像素画，例如：画一个红色药水瓶&#10;修改：瓶塞改成软木色 / 尺寸 32*32 / 复杂场景会自动拆 tile"></textarea>
        <button type="submit" id="sendBtn">发送</button>
      </form>
    </aside>

    <!-- 右：预览 -->
    <main class="right">
      <section class="preview-card">
        <div class="preview-head">
          <strong id="turnTitle">尚未生成</strong>
          <span class="meta" id="turnMeta"></span>
        </div>
        <div class="stage">
          <div id="stageInner" class="stage-inner" hidden>
            <img id="previewImg" alt="预览图">
            <div id="gridOverlay" class="grid-overlay" hidden></div>
          </div>
          <div id="placeholder" class="placeholder">在左侧输入需求，生成后此处显示像素预览</div>
        </div>
        <div class="tools">
          <label class="chk"><input type="checkbox" id="gridToggle"> 显示像素网格</label>
          <a id="downloadBtn" href="#" download hidden>⬇ 下载 PNG</a>
          <button id="copyBtn" hidden>📋 复制代码</button>
          <button id="backBtn" hidden>↩ 回到此轮</button>
        </div>
        <details id="codeBox" hidden>
          <summary>原始代码（点击展开）</summary>
          <pre id="codePre"></pre>
        </details>
      </section>

      <section class="history-card">
        <div class="preview-head"><strong>历史轮次</strong><span class="meta">点击缩略图查看 · “回到此轮”可从该图继续修改</span></div>
        <div id="history" class="history"><span class="meta">暂无</span></div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
